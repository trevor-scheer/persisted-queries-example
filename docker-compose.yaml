services:
  subgraph:
    build:
      context: .
      dockerfile: packages/subgraph/Dockerfile
    restart: unless-stopped
    network_mode: service:router

  router:
    image: ghcr.io/apollographql/router:v1.59.1
    restart: unless-stopped
    volumes:
      - ./router.yaml:/dist/config/router.yaml
    ports:
      - 4000:4000
    env_file:
      - .env
